[package]
name = "aie-store"
description = "Model store: pull GGUF models into content-addressed blobs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["fs", "io-util"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "rt-multi-thread", "net"] }

[lints]
workspace = true
