[workspace]
resolver = "3"
members = ["crates/*"]
# Spikes are throwaway experiments with their own lockfiles.
exclude = ["spikes/placement", "spikes/memory"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# Only aie-sys (OS calls) and aie-llama (the llama.cpp boundary) may use
# unsafe; they allow it at their crate roots. This covers every other target
# too: build scripts, examples, tests. See docs/architecture.md.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
