[workspace]
resolver = "3"
members = ["crates/*"]
# Spikes are throwaway experiments with their own lockfiles.
exclude = ["spikes/placement", "spikes/memory"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
