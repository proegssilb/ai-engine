# Checks on every push and pull request. Real-model tests skip themselves
# because no model store is present on the runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: System packages (llama.cpp build needs cmake and clang; the worker protocol needs protoc)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang libclang-dev protobuf-compiler
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          # llama.cpp's cmake build lives under target/, so it is cached too
          # and only rebuilt when the submodule or build.rs changes.
          cache-on-failure: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npx svelte-check --tsconfig ./tsconfig.json
      - run: npm run build
